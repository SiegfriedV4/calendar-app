<header class="flex flex-col border-b border-neutral-100 bg-white dark:bg-neutral-900">

  <!-- Top row — always visible -->
  <div class="flex items-center justify-between px-4 py-2 gap-2">

    <div class="flex items-center gap-1">
      <button (click)="store.navigatePrev()" class="cal-btn-icon">‹</button>
      <span class="text-base font-semibold text-center select-none min-w-36">{{ title() }}</span>
      <button (click)="store.navigateNext()" class="cal-btn-icon">›</button>
      <button (click)="goToday()" class="hidden md:inline-flex cal-btn text-sm">Today</button>
    </div>

    <!-- View switcher — desktop only in top row -->
    <div class="hidden md:flex gap-1">
      @for (v of views; track v) {
        <button
          class="cal-btn capitalize text-sm"
          [class.bg-blue-600]="store.activeView() === v"
          [class.text-white]="store.activeView() === v"
          (click)="goView(v)"
        >{{ v }}</button>
      }
    </div>

    <div class="flex items-center gap-1">
      <button (click)="holidaySearchToggled.emit()" class="cal-btn-icon" title="Search holidays">🔍</button>
      <button (click)="store.toggleDarkMode()" class="cal-btn-icon"
              [title]="store.isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'">
        @if (store.isDarkMode()) { ☀️ } @else { 🌙 }
      </button>
      <button (click)="openNewReminder()"
              class="hidden md:inline-flex cal-btn bg-neutral-100 text-neutral-700 hover:bg-neutral-200">
        + Reminder
      </button>
      <button (click)="openNewEvent()" class="cal-btn bg-blue-600 text-white hover:bg-blue-700">
        <span class="hidden md:inline">+ New Event</span>
        <span class="md:hidden text-lg leading-none">+</span>
      </button>
    </div>

  </div>

  <!-- Bottom row — mobile only: view tabs + Today + Reminder -->
  <div class="flex md:hidden items-center gap-1 px-4 pb-2">
    <button (click)="goToday()" class="cal-btn bg-neutral-100 text-neutral-700 text-sm">Today</button>
    @for (v of views; track v) {
      <button
        class="cal-btn capitalize text-sm flex-1"
        [class.bg-blue-600]="store.activeView() === v"
        [class.text-white]="store.activeView() === v"
        (click)="goView(v)"
      >{{ v }}</button>
    }
    <button (click)="openNewReminder()"
            class="cal-btn bg-neutral-100 text-neutral-700 text-sm">
      🔔
    </button>
  </div>

</header>
