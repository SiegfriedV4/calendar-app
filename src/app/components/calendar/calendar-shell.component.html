<div class="flex flex-col h-screen w-screen overflow-hidden bg-white dark:bg-neutral-900">
  <app-calendar-header />
  <main class="flex-1 overflow-hidden">
    @if (store.activeView() === 'year') { <app-year-view /> }
    @if (store.activeView() === 'month') { <app-month-view /> }
    @if (store.activeView() === 'week') { <app-week-view /> }
  </main>
  @if (store.activeModal() === 'event') { <app-event-modal /> }
  @if (store.activeModal() === 'reminder') { <app-reminder-modal /> }
</div>
