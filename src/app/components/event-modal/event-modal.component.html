<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm">
  <div class="bg-white dark:bg-neutral-800 rounded-2xl shadow-2xl w-full max-w-md mx-4 p-6">
    <h2 class="text-lg font-semibold mb-4">
      @if (store.itemBeingEdited()) { Edit Event } @else { New Event }
    </h2>

    <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
      <input formControlName="title"
             class="border border-neutral-200 rounded-lg px-3 py-2 text-sm
                    focus:outline-none focus:ring-2 focus:ring-blue-500"
             placeholder="Event title" />

      <input formControlName="date" type="date"
             class="border border-neutral-200 rounded-lg px-3 py-2 text-sm" />

      <label class="flex items-center gap-2 text-sm">
        <input formControlName="allDay" type="checkbox" /> All day
      </label>

      @if (!form.get('allDay')!.value) {
        <div class="flex gap-2">
          <input formControlName="startTime" type="time"
                 class="flex-1 border border-neutral-200 rounded-lg px-3 py-2 text-sm" />
          <input formControlName="endTime" type="time"
                 class="flex-1 border border-neutral-200 rounded-lg px-3 py-2 text-sm" />
        </div>
      }

      <!-- colour picker -->
      <div class="flex gap-2 flex-wrap">
        @for (color of colors; track color) {
          <button type="button"
                  class="w-7 h-7 rounded-full transition-transform hover:scale-110"
                  [class]="colorClass(color)"
                  [class.ring-2]="form.value.color === color"
                  [class.ring-offset-2]="form.value.color === color"
                  (click)="form.patchValue({ color })">
          </button>
        }
      </div>

      <select formControlName="notificationOffset"
              class="border border-neutral-200 rounded-lg px-3 py-2 text-sm">
        <option [value]="null">No notification</option>
        <option value="10">10 minutes before</option>
        <option value="60">1 hour before</option>
        <option value="1440">1 day before</option>
        <option value="custom">Custom...</option>
      </select>

      @if (form.value.notificationOffset === 'custom') {
        <input formControlName="customNotificationMinutes" type="number"
               class="border border-neutral-200 rounded-lg px-3 py-2 text-sm"
               placeholder="Minutes before" min="1" />
      }

      <div class="flex justify-between gap-2">
        @if (store.itemBeingEdited()) {
          <button type="button" (click)="delete()"
                  class="cal-btn bg-red-100 text-red-700 hover:bg-red-200">Delete</button>
        }
        <div class="flex gap-2 ml-auto">
          <button type="button" (click)="cancel()"
                  class="cal-btn bg-neutral-100 text-neutral-700 hover:bg-neutral-200">
            Cancel
          </button>
          <button type="submit"
                  class="cal-btn bg-blue-600 text-white hover:bg-blue-700">
            Save
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
