<div class="grid grid-cols-3 gap-4 p-4 h-full overflow-auto">
  @for (month of months(); track month.label) {
    <div
      class="border border-neutral-100 rounded-xl p-3 cursor-pointer hover:bg-blue-50 transition-colors"
      (click)="goToMonth(month.monthDate)"
    >
      <p class="text-xs font-semibold text-neutral-500 mb-2">{{ month.label }}</p>
      <div class="grid grid-cols-7 gap-px text-center text-xs">
        @for (d of DAY_HEADERS; track $index) {
          <span class="text-neutral-400 font-medium">{{ d }}</span>
        }
        @for (cell of month.days; track cell.iso) {
          <span
            class="py-0.5 rounded-full"
            [class.text-neutral-300]="!cell.isCurrentMonth"
            [class.bg-blue-500]="cell.isToday"
            [class.text-white]="cell.isToday"
          >{{ cell.date | formatDate:'d' }}</span>
        }
      </div>
    </div>
  }
</div>
