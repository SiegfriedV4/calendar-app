<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CalenderApp</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://holidayapi.com">
</head>
<body>
  <app-root>
    <!-- Skeleton shown while Angular bootstraps — replaced once the app mounts -->
    <div style="height:100svh;display:flex;flex-direction:column;background:#fff;font-family:system-ui,sans-serif;">
      <!-- Header bar -->
      <div style="height:49px;flex-shrink:0;border-bottom:1px solid #f3f4f6;display:flex;align-items:center;padding:0 1rem;gap:8px;">
        <div style="width:32px;height:32px;border-radius:8px;background:#f3f4f6;"></div>
        <div style="width:176px;height:18px;border-radius:4px;background:#f3f4f6;"></div>
        <div style="width:32px;height:32px;border-radius:8px;background:#f3f4f6;"></div>
        <div style="flex:1;"></div>
        <div style="width:40px;height:32px;border-radius:8px;background:#f3f4f6;"></div>
        <div style="width:56px;height:32px;border-radius:8px;background:#f3f4f6;"></div>
        <div style="width:48px;height:32px;border-radius:8px;background:#f3f4f6;"></div>
        <div style="flex:1;"></div>
        <div style="width:88px;height:32px;border-radius:8px;background:#f3f4f6;"></div>
        <div style="width:96px;height:32px;border-radius:8px;background:#3b82f6;"></div>
      </div>
      <!-- Day-of-week labels -->
      <div style="display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid #f3f4f6;flex-shrink:0;">
        <div style="padding:8px 0;text-align:center;font-size:11px;color:#9ca3af;font-weight:500;">Sun</div>
        <div style="padding:8px 0;text-align:center;font-size:11px;color:#9ca3af;font-weight:500;">Mon</div>
        <div style="padding:8px 0;text-align:center;font-size:11px;color:#9ca3af;font-weight:500;">Tue</div>
        <div style="padding:8px 0;text-align:center;font-size:11px;color:#9ca3af;font-weight:500;">Wed</div>
        <div style="padding:8px 0;text-align:center;font-size:11px;color:#9ca3af;font-weight:500;">Thu</div>
        <div style="padding:8px 0;text-align:center;font-size:11px;color:#9ca3af;font-weight:500;">Fri</div>
        <div style="padding:8px 0;text-align:center;font-size:11px;color:#9ca3af;font-weight:500;">Sat</div>
      </div>
      <!-- Calendar grid -->
      <div style="flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;">
        <div style="border:1px solid #f3f4f6;"></div><div style="border:1px solid #f3f4f6;"></div>
        <div style="border:1px solid #f3f4f6;"></div><div style="border:1px solid #f3f4f6;"></div>
        <div style="border:1px solid #f3f4f6;"></div><div style="border:1px solid #f3f4f6;"></div>
        <div style="border:1px solid #f3f4f6;"></div><div style="border:1px solid #f3f4f6;"></div>
        <div style="border:1px solid #f3f4f6;"></div><div style="border:1px solid #f3f4f6;"></div>
        <div style="border:1px solid #f3f4f6;"></div><div style="border:1px solid #f3f4f6;"></div>
        <div style="border:1px solid #f3f4f6;"></div><div style="border:1px solid #f3f4f6;"></div>
        <div style="border:1px solid #f3f4f6;"></div><div style="border:1px solid #f3f4f6;"></div>
        <div style="border:1px solid #f3f4f6;"></div><div style="border:1px solid #f3f4f6;"></div>
        <div style="border:1px solid #f3f4f6;"></div><div style="border:1px solid #f3f4f6;"></div>
        <div style="border:1px solid #f3f4f6;"></div><div style="border:1px solid #f3f4f6;"></div>
        <div style="border:1px solid #f3f4f6;"></div><div style="border:1px solid #f3f4f6;"></div>
        <div style="border:1px solid #f3f4f6;"></div><div style="border:1px solid #f3f4f6;"></div>
        <div style="border:1px solid #f3f4f6;"></div><div style="border:1px solid #f3f4f6;"></div>
        <div style="border:1px solid #f3f4f6;"></div><div style="border:1px solid #f3f4f6;"></div>
        <div style="border:1px solid #f3f4f6;"></div><div style="border:1px solid #f3f4f6;"></div>
        <div style="border:1px solid #f3f4f6;"></div><div style="border:1px solid #f3f4f6;"></div>
        <div style="border:1px solid #f3f4f6;"></div>
      </div>
    </div>
  </app-root>
</body>
</html>
